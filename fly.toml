# Fly.io deployment config for the backend persistent container
# docs/06-ops-deploy.md §2

app = 'exaint-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  build_target = 'api'

[env]
  PORT = '8080'
  HOST = '0.0.0.0'
  MARKET_SYMBOLS = 'BTC-USD,ETH-USD,SOL-USD,HYPE-USD,ZEC-USD'
  MARKET_SEED = '1337'
  AUTH_MODE = 'ticket'
  AUTH_TICKET_TTL_MS = '60000'
  ENABLE_DEBUG_CONTROLS = 'true'
  LOG_LEVEL = 'info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

[[http_service.checks]]
  grace_period = '10s'
  interval = '15s'
  method = 'GET'
  timeout = '5s'
  path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
